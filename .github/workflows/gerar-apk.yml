name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar o app para dentro do projeto Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/. android/app/src/main/assets/www/

      - name: Compilar o APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk DVARoads-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DVARoads-v1.0.${{ github.run_number }}
          path: DVARoads-v1.0.${{ github.run_number }}.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DVA Roads v1.0.${{ github.run_number }}
          files: DVARoads-v1.0.${{ github.run_number }}.apk
          body: |
            Toque em **DVARoads-v1.0.${{ github.run_number }}.apk** abaixo para baixar e instalar no Android.
            Se o Android pedir, permita "instalar apps desconhecidos" para o navegador.

            **DVA Roads — Obras, conserva e levantamentos (by DVABRAO SERVIÇOS LTDA)**
            - Núcleo comum: GPS em segundo plano, km e/ou estacas, sessões salvas no celular, backup .zip
            - Módulo Marco Zero: navegação e locação de obra
            - Módulo SLIR: patologias e inventário com foto legendada
            - Módulo SH: sinalização horizontal com um toque, KML e croqui linear
            - Módulo SV: placas, defensas e barreiras com estado de conservação e filtros
            - Módulos liberados por chave de ativação
